# Education Intelligence app (Portainer stack "edu-app", deployed from Git).
#
# Portainer -> Stacks -> Add stack -> name "edu-app" -> Repository
#   URL: https://github.com/Nadanalogaa/Edu   reference: refs/heads/main
#   Compose path: docker-compose.portainer.yml
#   Environment variables: POSTGRES_PASSWORD (same as the edu-db stack),
#   JWT_SECRET, CLIENT_URL, OWNER_EMAIL, OWNER_PASSWORD; optional SEED_DEMO_DATA,
#   GEMINI_API_KEY, PROXY_NETWORK.
# Requires the edu-db stack (deploy/edu-db-stack.yml) to be running first.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    # Rebuild from source on every deploy. Without this, Portainer reuses an
    # existing image of the same name and the deploy silently ships old code.
    pull_policy: build
    container_name: edu-app
    restart: always
    # Nginx Proxy Manager reaches the app over the proxy network (edu-app:3000).
    # Bound to localhost so the port is not open to the internet.
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://edu_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@edu-db:5432/education
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      # Public URL of the site, allowed by CORS
      FRONTEND_URL: ${CLIENT_URL:-https://edu.nadanaloga.com}
      # true = add the demo school, users and questions if the database is empty
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # The platform owner's login, created on startup if no owner exists yet.
      # Changing these later does not change an existing owner (use Change password).
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_NAME: ${OWNER_NAME:-Owner}
    volumes:
      # Registration documents and uploaded question files. Without this volume
      # every redeploy would delete them.
      - uploads:/app/backend/uploads
    networks:
      - edu-network
      - proxy

volumes:
  uploads:
    name: edu-uploads

networks:
  edu-network:
    external: true
  # The network Nginx Proxy Manager is attached to (Nadanaloga's app uses the same one).
  proxy:
    name: ${PROXY_NETWORK:-nadanaloga-main-network}
    external: true
